name: tests

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday: catches changes on the live sites

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --browser chrome -n 4
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: screenshots
          path: screenshots/
