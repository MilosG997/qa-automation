name: tests

on:
  push:
  workflow_dispatch:   # "Run workflow" button in the Actions tab, to check the live sites at any time

jobs:
  e2e:
    runs-on: ubuntu-24.04   # pinned: a new runner image cannot change results overnight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --browser chrome -n 4 --reruns 2 --reruns-delay 5
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: screenshots
          path: screenshots/
